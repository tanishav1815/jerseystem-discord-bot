services:
  bot:
    build: .
    container_name: jerseystem-discord-bot
    restart: always
    env_file:
      - .env
    # On macOS/Windows, to connect to MySQL running on the host machine (127.0.0.1):
    # Set DB_HOST=host.docker.internal in your .env file and uncomment below:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # Alternatively, if you want docker-compose to run a MySQL container for you,
    # you can uncomment the db service below and change DB_HOST=db in your .env:
